<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pullout Portal</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --bg: #f5f7fb; --surface: #ffffff; --text: #1e293b; --text-secondary: #64748b;
    --input-border: #e2e8f0; --input-focus: #6366f1; --chip-text: #4f46e5;
    --chip-bg: rgba(99,102,241,.12); --border: #e2e8f0;
    --purple-500: #7c3aed; --purple-400: #a855f7; --purple-100: #f3e8ff;
  }
  body.dark {
    --bg: #0f172a; --surface: #1e293b; --text: #f1f5f9; --text-secondary: #94a3b8;
    --input-border: #334155; --input-focus: #818cf8; --chip-text: #a5b4fc;
    --chip-bg: rgba(129,140,248,.12); --border: #334155;
    --purple-500: #a855f7; --purple-400: #c084fc; --purple-100: #4c1d95;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
  
  /* Sidebar RIGHT */
  #sidebar { width: 220px; background: var(--surface); border-left: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; position: fixed; right: 0; height: 100vh; overflow-y: auto; z-index: 100; }
  #sidebar h2 { font-size: 14px; font-weight: 700; color: var(--purple-500); margin-bottom: 12px; padding: 0 8px; letter-spacing: -.3px; }
  .nav-btn { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .nav-btn:hover { background: var(--chip-bg); color: var(--chip-text); border-color: var(--input-border); }
  .nav-btn.active { background: var(--purple-100); color: var(--purple-500); border-color: var(--purple-400); font-weight: 600; }
  .nav-btn .icon { font-size: 16px; width: 20px; text-align: center; }
  
  /* Main */
  #main { flex: 1; margin-right: 220px; padding: 24px 32px; max-width: 1400px; }
  .view { display: none; }
  .view.active { display: block; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 20px; letter-spacing: -.5px; }
  
  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  
  /* Forms */
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  .form-row label { font-size: 12px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; }
  .form-row select, .form-row input[type="text"], .form-row input[type="date"], .form-row input[type="file"] { flex: 1; min-width: 140px; max-width: 220px; padding: 7px 10px; border: 1px solid var(--input-border); border-radius: 6px; font-size: 12px; }
  .form-row input:focus, .form-row select:focus { outline: none; border-color: var(--input-focus); }
  
  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; background: transparent; color: var(--chip-text); border: 1.5px dashed var(--input-border); border-radius: 999px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .btn:hover { border-color: var(--input-focus); background: var(--chip-bg); transform: translateY(-2px); }
  .btn-primary { background: var(--purple-500); color: #fff; border-style: solid; border-color: var(--purple-500); }
  .btn-primary:hover { background: var(--purple-400); border-color: var(--purple-400); }
  .btn-sm { padding: 6px 14px; font-size: 12px; }
  
  /* Tables */
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--purple-100); color: var(--purple-500); font-weight: 600; padding: 10px 12px; text-align: left; position: sticky; top: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: var(--chip-bg); }
  
  /* Ticks */
  .tick-btn { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--input-border); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.15s; }
  .tick-btn:hover { transform: scale(1.1); }
  .tick-btn.ticked { background: #22c55e; border-color: #22c55e; color: #fff; }
  .tick-btn.crossed { background: #ef4444; border-color: #ef4444; color: #fff; }
  
  /* Badges */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-done { background: #dcfce7; color: #15803d; }
  .badge-pending { background: #fef9c3; color: #a16207; }
  
  /* Toast */
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.3s; }
  #toast.show { opacity: 1; }
  
  .lot-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .lot-card:hover { border-color: var(--purple-400); box-shadow: 0 2px 8px rgba(124,58,237,.08); }
  .lot-card .meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
  .action-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
</style>
</head>
<body>

<!-- SIDEBAR RIGHT (ORIGINAL) -->
<div id="sidebar">
  <h2>📦 Pullout Portal</h2>
  <button class="nav-btn active" data-view="shop"><span class="icon">🏪</span>Shop</button>
  <button class="nav-btn" data-view="bmq"><span class="icon">📤</span>BMQ</button>
  <button class="nav-btn" data-view="ase"><span class="icon">👔</span>ASE</button>
  <button class="nav-btn" data-view="asm"><span class="icon">🎯</span>ASM</button>
</div>

<div id="toast"></div>

<div id="main">

  <!-- SHOP VIEW -->
  <div id="view-shop" class="view active">
    <h1>🏪 Shop Portal</h1>
    <div class="card">
      <div class="form-row">
        <label>Region</label>
        <select id="shop-filter-region" onchange="populateASEDropdown()">
        </select>
        <label>Sub Region</label>
        <select id="shop-filter-ase" onchange="populateShopDropdown()">
        </select>
        <label>Shop</label>
        <select id="shop-filter" onchange="refreshShop()">
        </select>
      </div>
    </div>
    <div id="shop-lots"></div>
  </div>

  <!-- BMQ VIEW -->
  <div id="view-bmq" class="view">
    <h1>📤 BMQ — Create Lot & Sales Upload</h1>
    <div class="card">
      <h3>Create Lot</h3>
      <div class="form-row">
        <label>Lot ID</label>
        <input type="text" id="lot-id" placeholder="e.g., DC3 pull out">
        <label>Date</label>
        <input type="date" id="lot-day" value="">
      </div>
      <div class="form-row">
        <label>Pullout XLSX</label>
        <input type="file" id="pullout-file" accept=".xlsx,.xls">
        <button class="btn btn-primary" onclick="createLot()">Create Lot</button>
      </div>
      <p style="font-size:12px;color:var(--text-secondary)">Columns required: From, To, Style, Colour, Size, Qty</p>
    </div>
    <div class="card">
      <h3>Sales Upload & Reports</h3>
      <div class="form-row">
        <select id="bmq-sales-lot-select"></select>
        <button class="btn" onclick="pickSalesFolderBMQ()">📁 Upload Sales Folder</button>
      </div>
      <p style="font-size:12px;color:var(--text-secondary)" id="bmq-sales-status"></p>
    </div>
    <div id="bmq-report" style="display:none">
      <div class="card">
        <div class="action-btns">
          <button class="btn btn-primary" onclick="downloadXLSX()">⬇ Download XLSX</button>
          <button class="btn" onclick="downloadPDF()">⬇ Download PDF</button>
        </div>
      </div>
      <div class="card">
        <h3>Report Preview</h3>
        <div class="table-wrap" id="bmq-report-table"></div>
      </div>
    </div>
    <div class="card">
      <h3>All Lots</h3>
      <div id="bmq-lots"></div>
    </div>
  </div>

  <!-- ASE VIEW -->
  <div id="view-ase" class="view">
    <h1>👔 ASE — My Shops</h1>
    <div class="card">
      <h3>Create Lot for My Shops</h3>
      <div class="form-row">
        <label>Lot ID</label>
        <input type="text" id="ase-lot-id" placeholder="e.g., Weekly consolidation">
        <label>Date</label>
        <input type="date" id="ase-lot-day" value="">
      </div>
      <div class="form-row">
        <label>My Sub Region</label>
        <select id="ase-code-select"></select>
        <label>Pullout XLSX</label>
        <input type="file" id="ase-pullout-file" accept=".xlsx,.xls">
        <button class="btn btn-primary" onclick="createLotFromASE()">Create Lot</button>
      </div>
    </div>
    <div class="card">
      <h3>My Lots</h3>
      <div class="form-row">
        <label>Filter Sub Region</label>
        <select id="ase-filter-select" onchange="refreshASE()"></select>
      </div>
      <div id="ase-lots"></div>
    </div>
  </div>

  <!-- ASM VIEW -->
  <div id="view-asm" class="view">
    <h1>🎯 ASM  </h1>
    <div class="card">
      <h3>Create Lot (Any Region)</h3>
      <div class="form-row">
        <label>Lot ID</label>
        <input type="text" id="asm-lot-id" placeholder="e.g., DC3 pull out">
        <label>Date</label>
        <input type="date" id="asm-lot-day" value="">
      </div>
      <div class="form-row">
        <label>Region</label>
        <select id="asm-create-region"></select>
        <label>Pullout XLSX</label>
        <input type="file" id="asm-pullout-file" accept=".xlsx,.xls">
        <button class="btn btn-primary" onclick="createLotFromView('asm')">Create Lot</button>
      </div>
    </div>
    <div class="card">
      <h3>Dashboard</h3>
      <div class="form-row">
        <label>Filter Region</label>
        <select id="asm-filter-region" onchange="refreshASM()"></select>
      </div>
      <div id="asm-dashboard"></div>
    </div>
  </div>

</div>

function getShopEmail(shopCode) {

  return contact ? contact.to : null;
}

  const contact = SHOP_CONTACT_MAP[shopCode];
  if (contact) return contact.cc;
  // Fallback to region-based CC
  const region = getRegion(shopCode);
  return REGION_CC_MAP[region] || [];
}

function getASECCs(aseCode) {
  // Find region for this ASE
  for (const r of ASM_REGIONS) {
    const ase = r.ases.find(a => a.ase === aseCode);
    if (ase) return REGION_CC_MAP[r.asm] || [];
  }
  return [];
}

function getASMCCs(asmName) {
  return REGION_CC_MAP[asmName] || [];
}

/* ---------- IndexedDB ---------- */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('lots')) d.createObjectStore('lots', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('responses')) d.createObjectStore('responses', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('metadata')) d.createObjectStore('metadata', { keyPath: 'key' });
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}
function dbPut(store, val) { return new Promise((res, rej) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).put(val); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
function dbGetAll(store) { return new Promise((res, rej) => { const tx = db.transaction(store, 'readonly'); const req = tx.objectStore(store).getAll(); req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
function dbGet(store, key) { return new Promise((res, rej) => { const tx = db.transaction(store, 'readonly'); const req = tx.objectStore(store).get(key); req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
function dbDel(store, key) { return new Promise((res, rej) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }

/* ---------- Email Functions ---------- */
function generateEmailBody(lot, shopCode) {
  const lines = lot.lines.filter(l => l.to === shopCode);
  if (!lines.length) return '';
  
  const shopEmail = getShopEmail(shopCode) || shopCode + '@giordano.sa';
  const dateStr = new Date(lot.day).toLocaleDateString('en-GB');
  
  let html = `
    <html>
    <head>
      <style>
        body { font-family: Arial, sans-serif; font-size: 13px; color: #333; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th { background: #7c3aed; color: white; padding: 10px 8px; text-align: left; font-size: 12px; }
        td { border: 1px solid #e2e8f0; padding: 8px; font-size: 12px; }
        tr:nth-child(even) td { background: #f8fafc; }
        .header { margin-bottom: 16px; }
        .footer { margin-top: 24px; color: #64748b; font-size: 12px; }
      </style>
    </head>
    <body>
      <div class="header">
        <p>Dear ${shopCode},</p>
        <p>Please confirm receipt of the following pullout:</p>
      </div>
      <table>
        <thead>
          <tr>
            <th>From</th>
            <th>To</th>
            <th>Style</th>
            <th>Colour</th>
            <th>Size</th>
            <th>Qty</th>
          </tr>
        </thead>
        <tbody>
  `;
  
  lines.forEach(line => {
    html += `<tr><td>${esc(line.from)}</td><td>${esc(line.to)}</td><td>${esc(line.style)}</td><td>${esc(line.colour)}</td><td>${esc(line.size)}</td><td>${line.qty}</td></tr>`;
  });
  
  html += `
        </tbody>
      </table>
      <div class="footer">
        <p>Please tick ✓ to confirm receipt.</p>
        <p>Best regards,<br>Pullout Team</p>
      </div>
    </body>
    </html>
  `;
  return html;
}

function generateEmailSubject(lot, shopCode) {
  const dateStr = new Date(lot.day).toLocaleDateString('en-GB');
  return `Pullout Lot #${lot.lotId} - ${dateStr}`;
}

function getEmailCC(shopCode, view) {
  let cc = [];
  if (view === 'shop') {
    cc = getRegionCCs(shopCode);
  } else if (view === 'ase') {
    const aseCode = getASE(shopCode);
    cc = getASECCs(aseCode);
  } else if (view === 'asm') {
    const asmName = getASM(shopCode);
    cc = getASMCCs(asmName);
  } else if (view === 'bmq') {
    // For BMQ, use region CCs for each shop
    const region = getRegion(shopCode);
    cc = REGION_CC_MAP[region] || [];
  }
  return [...new Set(cc)]; // Deduplicate
}

function sendEmailDraft(lotId, shopCode, view) {
  const lot = dbGet('lots', lotId); // This is async, need to handle differently
  // We'll create a version that takes the lot object directly
  return sendEmailDraftForLot(lotId, shopCode, view);
}

async function sendEmailDraftForLot(lotId, shopCode, view) {
  const lot = await dbGet('lots', lotId);
  if (!lot) return toast('Lot not found');
  
  const to = getShopEmail(shopCode);
  if (!to) {
    toast('No email found for shop: ' + shopCode);
    return;
  }
  
  const cc = getEmailCC(shopCode, view).join(',');
  const subject = encodeURIComponent(generateEmailSubject(lot, shopCode));
  const body = encodeURIComponent(generateEmailBody(lot, shopCode));
  
  // Open Outlook Web / Gmail compose
  const mailtoUrl = `mailto:${to}?cc=${encodeURIComponent(cc)}&subject=${subject}&body=${body}`;
  
  // Try to open in default mail client
  window.location.href = mailtoUrl;
  
  toast('Opening email draft for ' + shopCode);
}

// Batch email functions for ASE/ASM/BMQ views
async function sendEmailBatch(lotId, shopCodes, view) {
  const lot = await dbGet('lots', lotId);
  if (!lot) return toast('Lot not found');
  
  // Group by shop code
  const shopGroups = {};
  shopCodes.forEach(code => {
    if (!shopGroups[code]) shopGroups[code] = [];
    shopGroups[code].push(code);
  });
  
  for (const shopCode of Object.keys(shopGroups)) {
    const to = getShopEmail(shopCode);
    if (!to) continue;
    
    const cc = getEmailCC(shopCode, view).join(',');
    const subject = encodeURIComponent(generateEmailSubject(lot, shopCode));
    const body = encodeURIComponent(generateEmailBody(lot, shopCode));
    
    const mailtoUrl = `mailto:${to}?cc=${encodeURIComponent(cc)}&subject=${subject}&body=${body}`;
    
    // Open each in new tab with small delay
    window.open(mailtoUrl, '_blank');
    await new Promise(r => setTimeout(r, 300));
  }
  
  toast(`Opened ${Object.keys(shopGroups).length} email drafts`);
}

/* ---------- Navigation ---------- */
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    location.hash = btn.dataset.view;
  });
});
function switchView(view) {
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
}

async function refreshView() {
  const hash = location.hash.replace('#', '') || 'shop';
  const view = ['shop','bmq','ase','asm'].includes(hash) ? hash : 'shop';
  if (view !== currentView) switchView(view);
  switch (view) {
    case 'shop': refreshShop(); break;
    case 'bmq': refreshBMQ(); break;
    case 'ase': refreshASE(); break;
    case 'asm': refreshASM(); break;

/* ---------- Console Log UI ---------- */
function logUI(...args) {
  const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
  const time = new Date().toLocaleTimeString();
  console.log(time, ...args);
  const logEl = document.getElementById('log-content');

    logEl.scrollTop = logEl.scrollHeight;
  }
}
function toast(msg) {

  t.textContent = msg; 
  t.classList.add('show'); 
  setTimeout(() => t.classList.remove('show'), 2500); 
}

/* ---------- XLSX Parse ---------- */
function parsePulloutXLSX(arrayBuffer) {
  return new Promise((resolve, reject) => {
    try {
      const wb = XLSX.read(arrayBuffer, { type: 'array' });
      logUI('📊 Sheets found:', wb.SheetNames);
      const allRows = [];
      wb.SheetNames.forEach(sheet => {
        const ws = wb.Sheets[sheet];
        const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        logUI(`📄 Sheet "${sheet}": ${data.length} rows`);
        if (!data.length) return;
        const headers = data[0].map(h => String(h || '').trim().toLowerCase());
        logUI('  Headers:', headers);
        const fromIdx = headers.indexOf('from'), toIdx = headers.indexOf('to');
        const styleIdx = headers.indexOf('style'), colIdx = headers.indexOf('colour');
        const sizeIdx = headers.indexOf('size'), qtyIdx = headers.indexOf('qty');
        logUI('  Indices:', { fromIdx, toIdx, styleIdx, colIdx, sizeIdx, qtyIdx });
        if (fromIdx < 0 || toIdx < 0) {
          logUI('  ⚠️ Missing From/To columns, skipping sheet');
          toast(`Sheet "${sheet}": Missing From/To columns`);
          return;
        }
        for (let i = 1; i < data.length; i++) {
          const row = data[i];
          if (!row[fromIdx] && !row[toIdx]) continue;
          allRows.push({
            from: String(row[fromIdx] || '').trim(),
            to: String(row[toIdx] || '').trim(),
            style: String(row[styleIdx] || row[1] || '').trim(),
            colour: String(row[colIdx] || row[2] || '').trim(),
            size: String(row[sizeIdx] || row[3] || '').trim(),
            qty: parseInt(row[qtyIdx] || row[5]) || 0
          });
        }
      });
      logUI('✅ Total rows parsed:', allRows.length);
      toast(`Parsed ${allRows.length} lines from ${wb.SheetNames.length} sheets`);
      resolve(allRows);
    } catch (e) {
      logUI('❌ Parse error:', e);
      toast('Parse error: ' + e.message);
      reject(e);
    }
  });
}

      const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
      console.log('✅ showDirectoryPicker succeeded');
      await processSalesFolder(dirHandle, lot);
      return;
    }
  } catch (e) {
    console.log('showDirectoryPicker failed:', e);
    if (e.name === 'SecurityError' || e.name === 'AbortError') {
      // User cancelled or not allowed on file:// - fall through to file input
    }
  }
  
  console.log('📁 Using fallback file input...');
  const input = document.createElement('input');
  input.type = 'file';
  input.webkitdirectory = true;
  input.multiple = true;
  input.accept = '.xlsx,.xls';
  input.onchange = async (e) => {
    console.log('📁 Files selected:', e.target.files.length);
    if (e.target.files.length === 0) {
      toast('No files selected');
      return;
    }
    await processSalesFiles(e.target.files, lot);
  };
  input.click();
}
async function processSalesFolder(dirHandle, lot) {
  const salesByStyle = {};
  for await (const entry of dirHandle.values()) {
    if (!entry.name.endsWith('.xlsx') && !entry.name.endsWith('.xls')) continue;
    const styleNum = entry.name.replace(/\.[^.]+$/, '').trim();
    if (!styleNum) continue;
    const file = await entry.getFile();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    salesByStyle[styleNum] = parseSalesSheet(data);
    console.log(`  📄 ${entry.name} → ${salesByStyle[styleNum].length} rows`);
  }
  buildReport(lot, salesByStyle);
}
async function processSalesFiles(files, lot) {
  const salesByStyle = {};
  for (const file of files) {
    if (!file.name.endsWith('.xlsx') && !file.name.endsWith('.xls')) continue;
    const styleNum = file.name.replace(/\.[^.]+$/, '').trim();
    if (!styleNum) continue;
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    salesByStyle[styleNum] = parseSalesSheet(data);
    console.log(`  📄 ${file.name} → ${salesByStyle[styleNum].length} rows`);
  }
  buildReport(lot, salesByStyle);
}

function parseSalesSheet(rows) {
  if (!rows.length) return [];
  const result = [];
  const headerRow = rows[1] || rows[0];
  const colourKeys = headerRow.filter((c, i) => i > 1 && c !== 'Total' && c !== null && c !== undefined).map(c => String(c).trim());
  for (let i = 2; i < rows.length; i++) {
    const shop = String(rows[i][0] || '').trim();
    if (!shop || shop === 'Grand Total') continue;
    colourKeys.forEach((col, ci) => {
      const baseCol = 2 + ci * 2;
      const sale = parseFloat(rows[i][baseCol]) || 0;
      const invy = parseFloat(rows[i][baseCol + 1]) || 0;
      result.push({ shop, colour: col, sale, invy });
    });
  }
  return result;
}

async function buildReport(lot, salesByStyle) {
  const detail = [];
  for (const [idx, line] of lot.lines.entries()) {
    const sales = (salesByStyle[line.style] || []).filter(s => 
      s.shop === line.to && s.colour === line.colour && s.size === line.size
    );
    const saleQty = sales.reduce((sum, s) => sum + s.sale, 0);
    const invy = sales.reduce((sum, s) => sum + s.invy, 0);
    const pull = line.qty;
    const variance = pull - saleQty;
    const sellPct = pull > 0 ? Math.round((saleQty / pull) * 100) : 0;
    
    // ONLY INCLUDE LINE IF TICKED (per shop's response for this To shop)
    const resp = await getResponse(lot.id, line.to);
    if (!resp.lineResponses[idx]?.tick) continue; // SKIP UNTICKED LINES
    
    detail.push({ 
      shop: line.to, 
      style: line.style, 
      colour: line.colour, 
      size: line.size, 
      pull, 
      sale: saleQty, 
      invy, 
      variance, 
      sellPct 
    });
  }
  currentReportData = { lot, detail };
  renderReport(detail);
  document.getElementById('bmq-report').style.display = 'block';
  toast('Report generated — ' + detail.length + ' rows (ticked lines only)');
}

/* ---------- Export XLSX ---------- */
async function downloadXLSX() {
  if (!currentReportData) return toast('No report');
  const { lot, detail } = currentReportData;
  const wb = XLSX.utils.book_new();
  const toSheet = (name, data, cols) => { const ws = XLSX.utils.json_to_sheet(data, { header: cols }); XLSX.utils.book_append_sheet(wb, ws, name); };
  
  // 1. Detail
  toSheet('Detail', detail, ['shop','style','colour','size','pull','sale','invy','variance','sellPct']);
  
  // 2. By Style
  const byStyle = {};
  detail.forEach(d => { 
    if (!byStyle[d.style]) byStyle[d.style] = { style: d.style, pull: 0, sale: 0, invy: 0 }; 
    byStyle[d.style].pull += d.pull; 
    byStyle[d.style].sale += d.sale; 
    byStyle[d.style].invy += d.invy; 
  });
  toSheet('By Style', Object.values(byStyle).map(s => ({ 
    ...s, variance: s.pull - s.sale, sellPct: s.pull ? Math.round(s.sale / s.pull * 100) : 0 
  })), ['style','pull','sale','invy','variance','sellPct']);
  
  // 3. By Colour (Style × Colour)
  const byColour = {};
  detail.forEach(d => { 
    const key = d.style + '|' + d.colour;
    if (!byColour[key]) byColour[key] = { style: d.style, colour: d.colour, pull: 0, sale: 0, invy: 0 }; 
    byColour[key].pull += d.pull; 
    byColour[key].sale += d.sale; 
    byColour[key].invy += d.invy; 
  });
  toSheet('By Colour', Object.values(byColour).map(s => ({ 
    ...s, variance: s.pull - s.sale, sellPct: s.pull ? Math.round(s.sale / s.pull * 100) : 0 
  })), ['style','colour','pull','sale','invy','variance','sellPct']);
  
  // 4. By Size (Style × Size)
  const bySize = {};
  detail.forEach(d => { 
    const key = d.style + '|' + d.size;
    if (!bySize[key]) bySize[key] = { style: d.style, size: d.size, pull: 0, sale: 0, invy: 0 }; 
    bySize[key].pull += d.pull; 
    bySize[key].sale += d.sale; 
    bySize[key].invy += d.invy; 
  });
  toSheet('By Size', Object.values(bySize).map(s => ({ 
    ...s, variance: s.pull - s.sale, sellPct: s.pull ? Math.round(s.sale / s.pull * 100) : 0 
  })), ['style','size','pull','sale','invy','variance','sellPct']);
  
  // 5. By Shop
  const byShop = {};
  detail.forEach(d => { 
    if (!byShop[d.shop]) byShop[d.shop] = { shop: d.shop, pull: 0, sale: 0, invy: 0 }; 
    byShop[d.shop].pull += d.pull; 
    byShop[d.shop].sale += d.sale; 
    byShop[d.shop].invy += d.invy; 
  });
  toSheet('By Shop', Object.values(byShop).map(s => ({ 
    ...s, variance: s.pull - s.sale, sellPct: s.pull ? Math.round(s.sale / s.pull * 100) : 0 
  })), ['shop','pull','sale','invy','variance','sellPct']);
  
  // 6. By Shop×Style
  const byShopStyle = {};
  detail.forEach(d => { 
    const key = d.shop + '|' + d.style;
    if (!byShopStyle[key]) byShopStyle[key] = { shop: d.shop, style: d.style, pull: 0, sale: 0, invy: 0 }; 
    byShopStyle[key].pull += d.pull; 
    byShopStyle[key].sale += d.sale; 
    byShopStyle[key].invy += d.invy; 
  });
  toSheet('By Shop×Style', Object.values(byShopStyle).map(s => ({ 
    ...s, variance: s.pull - s.sale, sellPct: s.pull ? Math.round(s.sale / s.pull * 100) : 0 
  })), ['shop','style','pull','sale','invy','variance','sellPct']);
  
  // 7. Summary
  const totalPull = detail.reduce((s, d) => s + d.pull, 0); 
  const totalSale = detail.reduce((s, d) => s + d.sale, 0);
  const overallSellPct = totalPull ? Math.round(totalSale / totalPull * 100) : 0;
  const flag = overallSellPct < 30 ? 'Review' : overallSellPct < 60 ? 'Monitor' : 'Good';
  toSheet('Summary', [{ 
    lotId: lot.lotId, day: lot.day, difficulty: lot.difficulty || 'N/A', 
    lines: lot.lines.length, totalPull, totalSale, sellPct: overallSellPct, flag 
  }], ['lotId','day','difficulty','lines','totalPull','totalSale','sellPct','flag']);
  
  XLSX.writeFile(wb, `Report_${lot.lotId}_${lot.day}.xlsx`);
  toast('7-sheet XLSX downloaded');
}

/* ---------- Escaping ---------- */
function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>'); }

/* ---------- Shared refresh based on current route ---------- */
async function refreshView() {
  const hash = location.hash.replace('#', '') || 'shop';
  const view = ['shop','bmq','ase','asm'].includes(hash) ? hash : 'shop';
  switchView(view);
  switch (view) {
    case 'shop': refreshShop(); break;
    case 'bmq': refreshBMQ(); break;
    case 'ase': refreshASE(); break;
    case 'asm': refreshASM(); break;
  }
}

  const sel = document.getElementById('shop-filter-region');

  sel.innerHTML = '';
  if (typeof ASM_REGIONS === 'undefined') { console.error('ASM_REGIONS not defined'); return; }

    const opt = document.createElement('option');
    opt.value = r.asm;
    opt.textContent = r.asm;
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  });
  // Trigger cascade for first region
  populateASEDropdown();
}

  const region = regionSel.value.trim();
  console.log('populateASEDropdown called, region:', region);
  sel.innerHTML = '';
  shopSel.innerHTML = '';
  if (!region || typeof ASM_REGIONS === 'undefined') { console.log('No region or ASM_REGIONS'); return; }
  const regionData = ASM_REGIONS.find(r => r.asm.trim() === region);
  if (!regionData) { console.warn('No matching region found for:', region); return; }
  console.log('Found region:', regionData.asm, 'ASEs:', regionData.ases.map(a => a.ase));
  regionData.ases.forEach((a, i) => {
    const opt = document.createElement('option');
    opt.value = a.ase;
    opt.textContent = a.ase + ' (' + a.shops.length + ' shops)';
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  });
  // Trigger cascade for first ASE
  populateShopDropdown();
}
function populateShopDropdown() {
  const aseSel = document.getElementById('shop-filter-ase');
  const sel = document.getElementById('shop-filter');
  if (!sel || !aseSel) { console.error('Elements not found'); return; }
  const aseCode = aseSel.value.trim();
  console.log('populateShopDropdown called, aseCode:', aseCode);
  sel.innerHTML = '';
  if (!aseCode || typeof ASM_REGIONS === 'undefined') { console.log('No aseCode or ASM_REGIONS'); return; }
  let found = false;
  ASM_REGIONS.forEach(r => {
    r.ases.forEach(a => {
      if (a.ase.trim() === aseCode) {
        found = true;
        console.log('Found ASE:', a.ase, 'shops:', a.shops);
        a.shops.forEach((shop, i) => {
          const opt = document.createElement('option');
          opt.value = shop;
          opt.textContent = shop;
          if (i === 0) opt.selected = true;
          sel.appendChild(opt);
        });
      }
    });
  });
  if (!found) console.warn('No matching ASE found for:', aseCode);
}

// Also expose for manual trigger
window.populateASEDropdown = populateASEDropdown;
window.populateShopDropdown = populateShopDropdown;

function populateASESelects() {
  // For ASE view create lot dropdown
  const createSel = document.getElementById('ase-code-select');
  if (createSel && createSel.options.length === 0) {
    createSel.innerHTML = '';
    ASM_REGIONS.forEach(r => r.ases.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.ase;
      opt.textContent = a.ase + ' (' + a.shops.length + ' shops)';
      createSel.appendChild(opt);
    }));
  }
  // For ASE view filter dropdown
  const filterSel = document.getElementById('ase-filter-select');
  if (filterSel && filterSel.options.length === 0) {
    filterSel.innerHTML = '';
    ASM_REGIONS.forEach(r => r.ases.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.ase;
      opt.textContent = a.ase + ' (' + a.shops.length + ' shops)';
      filterSel.appendChild(opt);
    }));
  }
}

function populateASMSelects() {
  // For ASM view create region dropdown
  const createSel = document.getElementById('asm-create-region');
  if (createSel && createSel.options.length === 0) {
    createSel.innerHTML = '';
    ASM_REGIONS.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.asm;
      opt.textContent = r.asm;
      createSel.appendChild(opt);
    });
  }
  // For ASM view filter dropdown
  const filterSel = document.getElementById('asm-filter-region');
  if (filterSel && filterSel.options.length === 0) {
    filterSel.innerHTML = '';
    ASM_REGIONS.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.asm;
      opt.textContent = r.asm;
      filterSel.appendChild(opt);
    });
  }
}

/* ---------- Init ---------- */
let dbReady = false;

async function initApp() {
  try {
    console.log('initApp called, readyState:', document.readyState);
    await openDB();
    dbReady = true;
    console.log('✅ IndexedDB ready');
    // Set today's date as default
    document.getElementById('lot-day').value = today();
    document.getElementById('ase-lot-day').value = today();
    document.getElementById('asm-lot-day').value = today();
    
    // Wait for DOM elements to be ready
    function waitForElements() {
      const regionSel = document.getElementById('shop-filter-region');
      const aseSel = document.getElementById('shop-filter-ase');
      const shopSel = document.getElementById('shop-filter');
      console.log('waitForElements:', { regionSel: !!regionSel, aseSel: !!aseSel, shopSel: !!shopSel });
      if (!regionSel || !aseSel || !shopSel) {
        console.log('Elements not ready, retrying...');
        requestAnimationFrame(waitForElements);
        return;
      }
      console.log('All elements ready, populating dropdowns');
      // Pre-populate all dropdowns
      populateRegionDropdown();
      populateASESelects();
      populateASMSelects();
      refreshView();
    }
    waitForElements();
  } catch (e) {
    console.error('Init error:', e);
    toast('Init error: ' + e.message);
  }
}

// Run immediately if DOM ready, else on load
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
// window.addEventListener('load', initApp); // Removed to prevent double execution
location.hash = '';
window.addEventListener('hashchange', refreshView);

/* ---------- About / Theme ---------- */
document.getElementById('about-btn').addEventListener('click', () => {
  const log = document.getElementById('log-console');
  log.style.display = log.style.display === 'none' ? 'block' : 'none';
});
// Theme toggle
const themeToggle = document.getElementById('theme-toggle');
themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  themeToggle.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
});
// Load saved theme
  const isDark = localStorage.getItem('theme') === 'dark';
  document.body.classList.toggle('dark', isDark);
  themeToggle.textContent = isDark ? '☀️' : '🌙';
</script>
