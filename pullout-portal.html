<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pullout Portal</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f5f7fb; --surface: #ffffff; --text: #1e293b; --text-secondary: #64748b;
    --input-border: #e2e8f0; --input-focus: #6366f1; --chip-text: #4f46e5;
    --chip-bg: rgba(99,102,241,.12); --border: #e2e8f0;
    --purple-500: #7c3aed; --purple-400: #a855f7; --purple-100: #f3e8ff;
  }
  body.dark {
    --bg: #0f172a; --surface: #1e293b; --text: #f1f5f9; --text-secondary: #94a3b8;
    --input-border: #334155; --input-focus: #818cf8; --chip-text: #a5b4fc;
    --chip-bg: rgba(129,140,248,.12); --border: #334155;
    --purple-500: #a855f7; --purple-400: #c084fc; --purple-100: #4c1d95;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }
  
  /* Sidebar LEFT */
  #sidebar { position: fixed; left: 0; top: 0; width: 220px; height: 100vh; background: var(--surface); border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; z-index: 100; }
  #sidebar h2 { font-size: 14px; font-weight: 700; color: var(--purple-500); margin-bottom: 12px; padding: 0 8px; letter-spacing: -.3px; }
  .nav-btn { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer; transition: all 0.15s; }
  .nav-btn:hover { background: var(--chip-bg); color: var(--chip-text); border-color: var(--input-border); }
  .nav-btn.active { background: var(--purple-100); color: var(--purple-500); border-color: var(--purple-400); font-weight: 600; }
  .nav-btn .icon { font-size: 16px; width: 20px; text-align: center; }
  
  /* Main content */
  #main { flex: 1; margin-left: 220px; padding: 24px 32px; }
  .view { display: none; }
  .view.active { display: block; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 20px; letter-spacing: -.5px; }
  
  /* Cards & Forms */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
  .form-row label { font-size: 12px; font-weight: 500; color: var(--text-secondary); white-space: nowrap; }
  .form-row select, .form-row input[type="text"], .form-row input[type="date"], .form-row input[type="file"] { flex: 1; min-width: 140px; max-width: 220px; padding: 7px 10px; border: 1px solid var(--input-border); border-radius: 6px; font-size: 12px; }
  .form-row input:focus, .form-row select:focus { outline: none; border-color: var(--input-focus); }
  
  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; background: transparent; color: var(--chip-text); border: 1.5px dashed var(--input-border); border-radius: 999px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .btn:hover { border-color: var(--input-focus); background: var(--chip-bg); transform: translateY(-2px); }
  .btn-primary { background: var(--purple-500); color: #fff; border-style: solid; border-color: var(--purple-500); }
  .btn-primary:hover { background: var(--purple-400); border-color: var(--purple-400); }
  .btn-sm { padding: 6px 12px; font-size: 11px; }
  
  /* Tables */
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--purple-100); color: var(--purple-500); font-weight: 600; padding: 10px 12px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: var(--chip-bg); }
  
  /* Tick/X buttons */
  .tick-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--input-border); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; transition: all 0.15s; }
  .tick-btn:hover { transform: scale(1.15); }
  .tick-btn.ticked { background: #22c55e; border-color: #22c55e; color: #fff; }
  .tick-btn.crossed { background: #ef4444; border-color: #ef4444; color: #fff; }
  
  /* Toast */
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.3s; }
  #toast.show { opacity: 1; }
  
  .action-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
</style>
</head>
<body>

<!-- SIDEBAR ON LEFT -->
<div id="sidebar">
  <h2>📦 Pullout Portal</h2>
  <button class="nav-btn active" data-view="shop"><span class="icon">🏪</span>Shop</button>
  <button class="nav-btn" data-view="bmq"><span class="icon">📤</span>BMQ</button>
  <button class="nav-btn" data-view="ase"><span class="icon">👔</span>ASE</button>
  <button class="nav-btn" data-view="asm"><span class="icon">🎯</span>ASM</button>
</div>

<div id="toast"></div>

<div id="main">

  <!-- SHOP VIEW -->
  <div id="view-shop" class="view active">
    <h1>🏪 Shop Portal</h1>
    
    <!-- 3-Dropdown Filter -->
    <div class="card">
      <div class="form-row">
        <label>Region</label>
        <select id="shop-filter-region" onchange="populateASEDropdown()">
          <option value="">-- Select Region --</option>
        </select>
        <label>Sub Region</label>
        <select id="shop-filter-ase" onchange="populateShopDropdown()">
          <option value="">-- Select Sub Region --</option>
        </select>
        <label>Shop</label>
        <select id="shop-filter" onchange="refreshShop()">
          <option value="">-- Select Shop --</option>
        </select>
      </div>
    </div>
    
    <!-- Lots Display -->
    <div id="shop-lots"></div>
  </div>

  <!-- BMQ VIEW -->
  <div id="view-bmq" class="view">
    <h1>📤 BMQ — Create Lot</h1>
    <div class="card">
      <h3>Create Lot</h3>
      <div class="form-row">
        <label>Lot ID</label>
        <input type="text" id="lot-id" placeholder="e.g., DC3 pull out">
        <label>Date</label>
        <input type="date" id="lot-day" value="">
      </div>
      <div class="form-row">
        <label>Pullout XLSX</label>
        <input type="file" id="pullout-file" accept=".xlsx,.xls">
        <button class="btn btn-primary" onclick="createLot()">Create Lot</button>
      </div>
      <p style="font-size:12px;color:var(--text-secondary)">Columns required: From, To, Style, Colour, Size, Qty</p>
    </div>
    <div class="card">
      <h3>All Lots</h3>
      <div id="bmq-lots"></div>
    </div>
  </div>

  <!-- ASE VIEW -->
  <div id="view-ase" class="view">
    <h1>👔 ASE — My Shops</h1>
    <div id="ase-lots"></div>
  </div>

  <!-- ASM VIEW -->
  <div id="view-asm" class="view">
    <h1>🎯 ASM</h1>
    <div id="asm-dashboard"></div>
  </div>

</div>

<script>
const DB_NAME = 'pullout-portal'; const DB_VER = 1;
let db; let currentView = 'shop';

function esc(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

const ASM_REGIONS = [
  { asm: 'SOUTH JEDDAH', ases: [
      { ase: 'SJ1', mobile: '0507236320', shops: ['M3011-MCJ', 'M3116-EMJ', 'M3139-CCB'] },
      { ase: 'SJ2', mobile: '', shops: ['M3058-ADJ', 'M3087-HFM', 'M3108-SMJ', 'M3178-SSJ', 'M3188-TSQ'] }
  ] },
  { asm: 'CENTRAL JEDDAH', ases: [
      { ase: 'CJ1', mobile: '0569670251', shops: ['M3046-AMJ', 'M3107-TSJ', 'M3W95-SST', 'M3133-YMJ', 'M3157-JPJ', 'M3189-PWJ'] }
  ] },
  { asm: 'NORTH JEDDAH', ases: [
      { ase: 'NJ1', mobile: '0541381881', shops: ['M3061-RSJ', 'M3065-MAG', 'M3136-KAU', 'M3164-SCJ', 'M3174-TVJ', 'M3181-IPJ'] },
      { ase: 'MKH', mobile: '0549191125', shops: ['M3053-AAB', 'M3190-H2M', 'M3170-SKM'] },
      { ase: 'MK1', mobile: '0531054485', shops: ['M3020-AHZ', 'M3082-ADB', 'M3121-SSM', 'M3171-JNM', 'M3185-LLM'] },
      { ase: 'MK2', mobile: '0549191125', shops: ['M3036-ZAM', 'M3090-MML', 'M3172-TVM', 'M3193-BRM'] },
      { ase: 'TAF (2)', mobile: '0599955479', shops: ['M3049-OBM', 'M3132-JMT', 'M3187-LMT'] }
  ] },
  { asm: 'TIER II CITIES', ases: [
      { ase: 'JZN', mobile: '0560061327', shops: ['M3081-ARJ', 'M3140-BLJ'] },
      { ase: 'KMT', mobile: '', shops: ['M3159-MPK', 'M3175-RMA'] }
  ] },
  { asm: 'NORTH WESTERN', ases: [
      { ase: 'MDN', mobile: '0508077461', shops: ['M3043-AAM', 'M3063-RML', 'M3064-NRM', 'M3169-TCC', 'M3177-ASM', 'M3186-MMM'] }
  ] },
  { asm: 'CENTRAL', ases: [
      { ase: 'RY1', mobile: '0537790385', shops: ['M3044-GRC', 'M3142-OMR', 'M3155-QMR', 'M3163-HMR', 'M3191-RSR'] },
      { ase: 'RY2', mobile: '0558625681', shops: ['M3056-HML', 'M3067-LBX', 'M3088-LLR', 'M3144-RPR', 'M3152-LRM', 'M3182-RGM', 'M3192-MSR'] },
      { ase: 'RY3', mobile: '0558394938', shops: ['M3015-RTM', 'M3143-VMB', 'M3162-LMR', 'M3923-MCO'] }
  ] },
  { asm: 'EASTERN', ases: [
      { ase: 'ALK', mobile: '0552524934', shops: ['M3013-ARM', 'M3027-ARC', 'M3070-LLU', 'M3131-LLD', 'M3149-LMD', 'M3161-OMD', 'M3166-WMD', 'M3167-LRD', 'M3180-NPK'] },
      { ase: 'HAS', mobile: '0595829552', shops: ['M3154-OMH', 'M3160-LMH'] },
      { ase: 'JUB', mobile: '', shops: ['M3W28-AJS', 'M3113-JST', 'M3127-LLJ', 'M3184-GMJ'] },
      { ase: 'ADR', mobile: '0563961005', shops: ['M3147-BLY', 'M3168-DLY', 'M3183-LMY'] }
  ] }
];

const SHOP_TO_ASM = {}, SHOP_TO_ASE = {};
ASM_REGIONS.forEach(r => {
  r.ases.forEach(a => {
    a.shops.forEach(s => {
      SHOP_TO_ASM[s] = r.asm;
      SHOP_TO_ASE[s] = a.ase;
    });
  });
});

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('lots')) d.createObjectStore('lots', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('responses')) d.createObjectStore('responses', { keyPath: 'id' });
    };
    req.onsuccess = () => { db = req.result; res(db); };
    req.onerror = () => rej(req.error);
  });
}

function dbPut(store, val) { return new Promise((res, rej) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).put(val); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
function dbGetAll(store) { return new Promise((res, rej) => { const tx = db.transaction(store, 'readonly'); const req = tx.objectStore(store).getAll(); req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
function dbGet(store, key) { return new Promise((res, rej) => { const tx = db.transaction(store, 'readonly'); const req = tx.objectStore(store).get(key); req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
function dbDel(store, key) { return new Promise((res, rej) => { const tx = db.transaction(store, 'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function today() { return new Date().toISOString().split('T')[0]; }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => { location.hash = btn.dataset.view; });
});

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
}

async function refreshView() {
  const hash = location.hash.replace('#', '') || 'shop';
  const view = ['shop','bmq','ase','asm'].includes(hash) ? hash : 'shop';
  if (view !== currentView) switchView(view);
  if (view === 'shop') refreshShop();
  else if (view === 'bmq') refreshBMQ();
}

function populateASEDropdown() {
  const regionId = document.getElementById('shop-filter-region').value;
  const aseSelect = document.getElementById('shop-filter-ase');
  aseSelect.innerHTML = '<option value="">-- Select Sub Region --</option>';
  
  if (!regionId) return;
  const region = ASM_REGIONS.find(r => r.asm === regionId);
  if (region) {
    region.ases.forEach(ase => {
      const opt = document.createElement('option');
      opt.value = ase.ase;
      opt.textContent = ase.ase;
      aseSelect.appendChild(opt);
    });
  }
}

function populateShopDropdown() {
  const regionId = document.getElementById('shop-filter-region').value;
  const aseId = document.getElementById('shop-filter-ase').value;
  const shopSelect = document.getElementById('shop-filter');
  shopSelect.innerHTML = '<option value="">-- Select Shop --</option>';
  
  if (!regionId || !aseId) return;
  const region = ASM_REGIONS.find(r => r.asm === regionId);
  if (region) {
    const ase = region.ases.find(a => a.ase === aseId);
    if (ase) {
      ase.shops.forEach(shop => {
        const opt = document.createElement('option');
        opt.value = shop;
        opt.textContent = shop;
        shopSelect.appendChild(opt);
      });
    }
  }
}

async function refreshShop() {
  // Populate Region dropdown
  const regionSelect = document.getElementById('shop-filter-region');
  if (regionSelect.options.length <= 1) {
    ASM_REGIONS.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.asm;
      opt.textContent = r.asm;
      regionSelect.appendChild(opt);
    });
  }
  
  const shopCode = document.getElementById('shop-filter').value;
  const lots = await dbGetAll('lots');
  const el = document.getElementById('shop-lots');
  
  if (!shopCode) {
    el.innerHTML = '<p style="color:var(--text-secondary)">Select shop to view lots</p>';
    return;
  }
  
  const myLots = lots.filter(l => l.lines.some(line => line.to === shopCode));
  if (!myLots.length) {
    el.innerHTML = '<p style="color:var(--text-secondary)">No lots</p>';
    return;
  }
  
  // Render with FULL TABLE + TICK/X buttons per line
  el.innerHTML = myLots.map(lot => {
    const lines = lot.lines.filter(l => l.to === shopCode);
    return `
      <div class="card">
        <h3>${esc(lot.lotId)} - ${lot.day}</h3>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>From</th><th>To</th><th>Style</th><th>Colour</th><th>Size</th><th>Qty</th><th>✓</th><th>✗</th>
            </tr></thead>
            <tbody>
              ${lines.map((line, i) => `
                <tr>
                  <td>${esc(line.from)}</td>
                  <td><strong>${esc(line.to)}</strong></td>
                  <td>${esc(line.style)}</td>
                  <td>${esc(line.colour)}</td>
                  <td>${esc(line.size)}</td>
                  <td>${line.qty}</td>
                  <td><button class="tick-btn" onclick="markTick('${lot.id}', ${i})">✓</button></td>
                  <td><button class="tick-btn" onclick="markCross('${lot.id}', ${i})">✗</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        <div class="action-btns">
          <button class="btn btn-primary btn-sm" onclick="createEmailDraftForShop('${lot.id}', '${shopCode}')">📧 Email All</button>
          <button class="btn btn-sm" onclick="deleteLot('${lot.id}')">🗑 Delete</button>
        </div>
      </div>
    `;
  }).join('');
}

function markTick(lotId, lineIdx) {
  toast('✓ Confirmed line ' + (lineIdx + 1));
}

function markCross(lotId, lineIdx) {
  toast('✗ Rejected line ' + (lineIdx + 1));
}

function parsePulloutXLSX(arrayBuffer) {
  return new Promise((resolve, reject) => {
    try {
      const wb = XLSX.read(arrayBuffer, { type: 'array' });
      const allRows = [];
      wb.SheetNames.forEach(sheet => {
        const ws = wb.Sheets[sheet];
        const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
        if (!data.length) return;
        const headers = data[0].map(h => String(h || '').trim().toLowerCase());
        const fromIdx = headers.indexOf('from'), toIdx = headers.indexOf('to');
        const styleIdx = headers.indexOf('style'), colIdx = headers.indexOf('colour');
        const sizeIdx = headers.indexOf('size'), qtyIdx = headers.indexOf('qty');
        if (fromIdx < 0 || toIdx < 0) return;
        for (let i = 1; i < data.length; i++) {
          const row = data[i];
          if (!row[fromIdx] && !row[toIdx]) continue;
          allRows.push({
            from: String(row[fromIdx] || '').trim(),
            to: String(row[toIdx] || '').trim(),
            style: String(row[styleIdx] || '').trim(),
            colour: String(row[colIdx] || '').trim(),
            size: String(row[sizeIdx] || '').trim(),
            qty: parseInt(row[qtyIdx]) || 0
          });
        }
      });
      resolve(allRows);
    } catch (e) {
      reject(e);
    }
  });
}

async function createLot() {
  const lotId = document.getElementById('lot-id').value.trim();
  const day = document.getElementById('lot-day').value || today();
  const fileInput = document.getElementById('pullout-file');
  if (!lotId) return toast('Enter Lot ID');
  if (!fileInput.files[0]) return toast('Upload XLSX');
  const lines = await parsePulloutXLSX(await fileInput.files[0].arrayBuffer());
  if (!lines.length) return toast('No lines found');
  const lot = { id: 'lot_' + uid(), lotId, day, createdAt: new Date().toISOString(), lines };
  await dbPut('lots', lot);
  toast('Lot created!');
  fileInput.value = '';
  document.getElementById('lot-id').value = '';
  refreshBMQ();
}

async function refreshBMQ() {
  const lots = await dbGetAll('lots');
  const el = document.getElementById('bmq-lots');
  if (!lots.length) { el.innerHTML = '<p style="color:var(--text-secondary)">No lots</p>'; return; }
  el.innerHTML = lots.map(l => `
    <div class="card">
      <strong>${esc(l.lotId)}</strong> - ${l.day}
      <div class="action-btns" style="margin-top:10px">
        <button class="btn btn-sm" onclick="deleteLot('${l.id}')" style="color:#ef4444">🗑 Delete</button>
        <button class="btn btn-sm" onclick="createEmailDraftForBatch('${l.id}')">📧 Email All</button>
      </div>
    </div>
  `).join('');
}

async function createEmailDraftForShop(lotId, shopCode) {
  const lot = await dbGet('lots', lotId);
  if (!lot) return toast('Lot not found');
  
  const lines = lot.lines.filter(l => l.to === shopCode);
  const subject = `Pullout Lot ${lot.lotId} - ${lot.day}`;
  
  let body = `Dear ${shopCode},\n\nPlease confirm receipt of the following pullout:\n\n`;
  lines.forEach(line => {
    body += `${line.from} → ${line.to}: ${line.style} ${line.colour} ${line.size} Qty: ${line.qty}\n`;
  });
  body += `\nPlease reply with ✓ or ✗ for each line.\n\nThank you`;
  
  // Use mailto with proper encoding
  const email = shopCode + '@giordano.sa';
  window.open(`mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`, '_blank');
  toast('Email opened for ' + shopCode);
}

async function createEmailDraftForBatch(lotId) {
  const lot = await dbGet('lots', lotId);
  if (!lot) return toast('Lot not found');
  
  const uniqueShops = [...new Set(lot.lines.map(l => l.to))];
  let count = 0;
  
  for (const shop of uniqueShops) {
    const subject = `Pullout Lot ${lot.lotId} - ${lot.day}`;
    const lines = lot.lines.filter(l => l.to === shop);
    
    let body = `Dear ${shop},\n\nPlease confirm receipt:\n\n`;
    lines.forEach(line => {
      body += `${line.from} → ${line.to}: ${line.style} ${line.colour} ${line.size} Qty: ${line.qty}\n`;
    });
    body += `\nReply with ✓ or ✗\n\nThank you`;
    
    const email = shop + '@giordano.sa';
    window.open(`mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`, '_blank');
    count++;
    await new Promise(r => setTimeout(r, 300));
  }
  
  toast(`Opened ${count} email drafts`);
}

async function deleteLot(lotId) {
  await dbDel('lots', lotId);
  toast('Lot deleted');
  refreshView();
}

window.addEventListener('load', async () => {
  await openDB();
  refreshView();
});

window.addEventListener('hashchange', refreshView);

// Initial populate
document.getElementById('shop-filter-region').innerHTML = '<option value="">-- Select Region --</option>';
ASM_REGIONS.forEach(r => {
  const opt = document.createElement('option');
  opt.value = r.asm;
  opt.textContent = r.asm;
  document.getElementById('shop-filter-region').appendChild(opt);
});

// Set today's date
document.getElementById('lot-day').value = today();
document.getElementById('lot-id').focus();
</script>
</body>
</html>
